name: Release

# Publishes @testquality/sdk when a v* tag is pushed (`yarn release` bumps the
# version, commits, tags and pushes; this workflow does the npm publish).
#
# npm trusted publishing (OIDC): npm trusts this workflow in the Release
# environment directly, so there is no NPM_TOKEN to expire or leak and no OTP.
# Configured on npmjs.com under @testquality/sdk -> Settings -> Trusted Publisher
# (BitModern / test-quality-sdk / release.yml / Release).

on:
  push:
    tags:
      - 'v*'
  # Dry run: every check, including the live staging tests, without publishing.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: Release

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1.
          node-version: 24
      - name: Update npm for trusted publishing
        run: npm install -g npm@latest
      - name: Enable Corepack
        run: corepack enable

      - name: Tag must match package.json version
        if: github.ref_type == 'tag'
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json $PKG"
            exit 1
          fi

      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn test
      # Live API tests against staging. TQ_REQUIRE_INTEGRATION makes missing
      # secrets fail instead of skipping; the tests refuse a production host.
      - name: Integration tests (staging)
        run: yarn test:integration
        env:
          TQ_REQUIRE_INTEGRATION: '1'
          TQ_HOST: ${{ vars.TQ_HOST }}
          TQ_EMAIL: ${{ secrets.TQ_EMAIL }}
          TQ_EMAIL2: ${{ secrets.TQ_EMAIL2 }}
          TQ_PASSWORD: ${{ secrets.TQ_PASSWORD }}
      # prepublish no longer runs on `npm publish` (npm >= 7), so build explicitly.
      - run: yarn build

      - name: Publish to npm
        if: github.ref_type == 'tag'
        run: npm publish
